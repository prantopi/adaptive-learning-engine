[project]
name = "adaptive-learning-engine"
version = "0.1.0"
description = "Bayesian knowledge tracing, personalised spaced repetition, item difficulty and dropout prediction as small, tested Python functions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learning_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
